name: Build image

# 全自动构建 fnOS for AIOT-3588A 的 update.img
#
# 触发方式：
#   1) Actions 页面手动 Run workflow（产物作为 artifact 下载）
#   2) 推送 v* 标签（额外把 update.img 发到 Release）
#
# 依赖的外部资源（全部公开、可缓存）：
#   - ophub/fnnas 底稿镜像 fnnas_rockchip_1253（仅取 rootfs）
#   - ophub/fnnas 官方内核包 kernel_fnnas/6.18.18-rockchip.tar.gz
#   - kernel.org linux-6.18.18 源码（仅取编译 dts 需要的头文件）
# u-boot 用仓库里预编译的 assets/uboot.img（源码补丁见 patches/uboot/，见 docs/UBOOT.md）。
#
# 密码类配置（WiFi/root）不要写进仓库：在仓库 Settings → Secrets 里配置同名变量，
# 本工作流会把它们写进临时的 config.env（该文件已被 .gitignore 忽略）。

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      WIFI_SSID: ${{ secrets.WIFI_SSID }}
      WIFI_PASSWORD: ${{ secrets.WIFI_PASSWORD }}
      WIFI_FALLBACK_SSID: ${{ secrets.WIFI_FALLBACK_SSID }}
      WIFI_FALLBACK_PASSWORD: ${{ secrets.WIFI_FALLBACK_PASSWORD }}
      ROOT_PASSWORD: ${{ secrets.ROOT_PASSWORD }}
      USB_ROLE: ${{ secrets.USB_ROLE }}
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 释放磁盘空间
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /usr/local/share/chromium \
                      "$AGENT_TOOLSDIRECTORY" || true
          df -h /

      - name: 安装构建依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            rsync zstd cpio device-tree-compiler gcc \
            e2fsprogs btrfs-progs fdisk parted \
            qemu-user-static bzip2 xz-utils curl python3

      - name: 缓存下载的大文件（底稿镜像/内核包/内核源码）
        uses: actions/cache@v4
        with:
          path: |
            work/fnnas_base.img.gz
            work/kernel-fnos/6.18.18-rockchip.tar.gz
            work/linux-6.18.18.tar.xz
          key: downloads-v1-${{ runner.os }}-${{ hashFiles('scripts/lib-common.sh', 'scripts/build-dts.sh', 'scripts/prepare-boot.sh') }}

      - name: 生成 config.env
        run: |
          cp config.env.example config.env
          python3 - <<'PY'
          import os, re
          path = "config.env"
          text = open(path).read()
          for key in ("WIFI_SSID", "WIFI_PASSWORD", "WIFI_FALLBACK_SSID",
                      "WIFI_FALLBACK_PASSWORD", "ROOT_PASSWORD", "USB_ROLE"):
              val = os.environ.get(key, "")
              if not val:
                  continue
              text = re.sub(rf'^{key}=.*$', f'{key}="{val}"', text, flags=re.M)
          open(path, "w").write(text)
          print("config.env 已生成（空值保持留空）")
          PY

      - name: 构建 update.img
        run: |
          set -euo pipefail
          sudo -E env WORK_DIR="$PWD/work" OUTPUT_DIR="$PWD/output" \
               bash scripts/build-all.sh
          sudo chown -R "$(id -u):$(id -g)" work output || true
          ls -lh output/

      - name: 生成校验文件并压缩镜像
        run: |
          set -euo pipefail
          img=$(ls output/*.img | head -1)
          base=$(basename "$img")
          log() { echo "::group::[pack] $*"; }

          # 1) 原始镜像的校验和（解压后用它验镜像本体）
          ( cd output && sha256sum "$base" > SHA256SUMS )
          echo "镜像 sha256:"; cat output/SHA256SUMS

          # 2) zstd 压缩（多线程 + 长窗口；比 upload-artifact 的 zip 小得多）
          log "zstd 压缩 $base"
          zstd -T0 -19 --long=27 -f "$img" -o "output/$base.zst"
          ( cd output && sha256sum "$base.zst" > "$base.zst.sha256" )

          echo "压缩完成："
          ls -lh output
          echo "::endgroup::"

      - name: 上传 artifact
        uses: actions/upload-artifact@v4
        with:
          name: fnos-aiot3588a-update
          path: |
            output/*.img.zst
            output/*.img.zst.sha256
            output/SHA256SUMS
          if-no-files-found: error
          # 已经是 zstd 压缩过的文件，artifact 层不再二次压缩
          compression-level: 0
          retention-days: 14

      - name: 发布 Release（仅 v* 标签）
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          img=$(ls output/*.img | head -1)
          base=$(basename "$img")
          zst="output/$base.zst"
          [ -f "$zst" ] || { echo "缺少 $zst"; exit 1; }
          {
            echo "构建于 $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
            echo "## 下载与烧录"
            echo '```bash'
            echo "unzstd $base.zst                     # 得到 $base"
            echo "sha256sum -c SHA256SUMS              # 校验镜像"
            echo "sudo upgrade_tool_2.45 uf $base      # 一条命令烧录"
            echo '```'
          } > RELEASE_NOTES.md
          gh release create "$GITHUB_REF_NAME" \
            "$zst" "output/$base.zst.sha256" "output/SHA256SUMS" \
            --title "fnOS for AIOT-3588A $GITHUB_REF_NAME" \
            --notes-file RELEASE_NOTES.md \
            --verify-tag
