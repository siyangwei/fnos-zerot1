name: build-fnos-image

# 构建 fnOS(fnNAS) for Shimeta AIOT-3588A (RK3588)
#
# 流程（见 docs/BUILD.md）：
#   1) 下载 ophub 的 fnOS 底稿镜像（nanopc-t6, k6.18.18）→ 只取 rootfs（Debian12 + 飞牛服务）
#   2) 用友善 u-boot + 友善 Linux 6.1.141 内核（打看门狗/板级 dts 补丁）重新组装
#   3) 打 rootfs 补丁（fstab / WiFi-BT 固件 / adb / XFCE / watchdog）
#   4) Rockchip 工具打 update.img（upgrade_tool uf 烧录）
#
# 预编译复用：assets/ 里的 MiniLoaderAll.bin、uboot.img（含 distro_bootcmd 补丁）、
# 打包工具与 WiFi/BT 固件都已入库，日常构建不需要重新编译 u-boot，也不需要下载友善工具链。

on:
  workflow_dispatch:
    inputs:
      skip_xfce:
        description: '跳过 XFCE 桌面（更快的构建，得到一个纯 NAS 系统）'
        type: boolean
        default: false
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 清理磁盘（内核源码 + rootfs + 镜像需要 ~20GB）
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          sudo apt-get clean
          df -h /

      - name: 安装依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential gcc-aarch64-linux-gnu \
            qemu-user-static binfmt-support \
            device-tree-compiler bc rsync git \
            btrfs-progs dosfstools mtools \
            gzip xz-utils curl
          ls -l /usr/bin/qemu-aarch64-static
          df -h /

      - name: 读取 config.env（仓库根配置；同名 Secrets 优先）
        env:
          S_WIFI_SSID: ${{ secrets.WIFI_SSID }}
          S_WIFI_PASSWORD: ${{ secrets.WIFI_PASSWORD }}
          S_ROOT_PASSWORD: ${{ secrets.ROOT_PASSWORD }}
        run: |
          # 仓库根的 config.env 是唯一配置入口：WiFi、root 密码、构建开关都从这里读。
          # CI 上若配置了同名 Secrets 则优先（不必把密码写进公开仓库）。
          set -a
          [ -f config.env ] && . ./config.env
          set +a

          [ -n "${S_WIFI_SSID:-}" ] && echo "WIFI_SSID=$S_WIFI_SSID" >> "$GITHUB_ENV"
          [ -n "${S_WIFI_PASSWORD:-}" ] && echo "WIFI_PASSWORD=$S_WIFI_PASSWORD" >> "$GITHUB_ENV"
          [ -n "${S_ROOT_PASSWORD:-}" ] && echo "ROOT_PASSWORD=$S_ROOT_PASSWORD" >> "$GITHUB_ENV"

          # config.env 里定义的所有变量都导出给后续步骤（sudo -E 会保留）
          for k in $(grep -oE '^[A-Za-z_][A-Za-z0-9_]*' config.env 2>/dev/null | sort -u); do
            v="${!k-}"
            [ -n "$v" ] && echo "$k=$v" >> "$GITHUB_ENV"
          done
          echo "---- 生效配置（敏感值不打印）----"
          for k in WIFI_SSID WIFI_FALLBACK_SSID WIFI_HIDDEN WIFI_COUNTRY ENABLE_WIFI ENABLE_SSH DEVICE_HOSTNAME SKIP_XFCE; do
            echo "$k=${!k-<未设置>}"
          done

      - name: 构建 update.img
        env:
          SKIP_XFCE: ${{ inputs.skip_xfce && '1' || '0' }}
        run: |
          if [ "$SKIP_XFCE" = "1" ]; then
            mv patches/rootfs/40-xfce.sh /tmp/40-xfce.sh.disabled
          fi
          sudo -E ./scripts/build-all.sh
          if [ "$SKIP_XFCE" = "1" ]; then
            mv /tmp/40-xfce.sh.disabled patches/rootfs/40-xfce.sh
          fi

      - name: 产物信息
        run: |
          ls -lh output/
          sha256sum output/*.img | tee output/SHA256SUMS

      - name: 压缩（update.img ~5.8GB → gz ~1.8GB，便于上传）
        run: gzip -1 -k output/*.img

      - name: 上传构建产物（artifact）
        uses: actions/upload-artifact@v4
        with:
          name: fnos-aiot3588a-update
          path: |
            output/*.img.gz
            output/SHA256SUMS
          compression-level: 0
          retention-days: 30

      - name: 发布 Release（tag push 时）
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            output/*.img.gz
            output/SHA256SUMS
          generate_release_notes: true
